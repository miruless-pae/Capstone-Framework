services:
  # Database PostgreSQL. Port hanya dibuka ke localhost VPS (untuk development/seed).
  db:
    image: postgres:16-alpine
    container_name: vibr-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE:-vibr}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # Backend API (NestJS). Tidak dipublikasikan ke host; diakses lewat nginx.
  api:
    build: .
    container_name: vibr-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      # development agar tabel dibuat otomatis (synchronize); belum ada migration
      NODE_ENV: development
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE:-vibr}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      STORAGE_BASE_URL: ${STORAGE_BASE_URL:-http://localhost:3000/files}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      SCHEDULER_INTERVAL_MS: ${SCHEDULER_INTERVAL_MS:-30000}
      SCHEDULER_BATCH_SIZE: ${SCHEDULER_BATCH_SIZE:-20}
    expose:
      - "3000"
    networks:
      - backend

  # Reverse proxy: satu-satunya pintu masuk dari luar (port 80).
  nginx:
    image: nginx:alpine
    container_name: vibr-nginx
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - backend

volumes:
  pgdata:

networks:
  backend:
